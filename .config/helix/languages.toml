# ---------------------------------------------------------------------------
# Languages
# ---------------------------------------------------------------------------

[[language]]
name = "bash"
formatter = { command = "/usr/bin/env", args = [
  "PATH=/Users/romcheck/.local/share/mise/shims:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin",
  "shfmt",
  "-i", "2",
  "-ci",
  "-bn",
  "-sr",
] }
auto-format = true

[[language]]
name = "python"
language-servers = ["ty"]
formatter = { command = "/usr/bin/env", args = [
  "PATH=/Users/romcheck/.local/share/mise/shims:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin",
  "ruff",
  "format",
  "--stdin-filename", "%{buffer_name}",
  "-",
] }
auto-format = true

[[language]]
name = "json"
formatter = { command = "/usr/bin/env", args = [
  "PATH=/Users/romcheck/.local/share/mise/shims:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin",
  "biome",
  "format",
  "--stdin-file-path", "%{buffer_name}",
] }
auto-format = true

[[language]]
name = "javascript"
language-servers = ["typescript-language-server"]
formatter = { command = "/usr/bin/env", args = [
  "PATH=/Users/romcheck/.local/share/mise/shims:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin",
